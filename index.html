<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>干饭贩卖机</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="topbar">
    <div class="logo">FOOD DISPENSER<span class="zh">干饭贩卖机</span></div>
    <div class="top-actions">
      <button class="lib-btn" data-act="openLib">我的美食库</button>
      <button class="lib-btn" data-act="openAvoid">忌口设置<span class="badge" id="avoidBadge"></span></button>
    </div>
  </div>

  <div class="machine" id="machine">
    <div class="machine-sign"><span class="bulbs"><i></i><i></i></span>今天吃什么？</div>
    <div class="machine-body">
      <div class="glass"><div class="shelf" id="shelf"></div></div>
      <div class="controls">
        <div class="coin-slot"></div>
        <button class="draw-btn" data-act="openPrefs">抽</button>
        <div class="keypad"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <div class="slot"><div class="slot-inner">出 票 口</div></div>
  </div>

  <p class="footnote">
    点【抽】→ 选时段与偏好 → 确认 → 饭票从出票口弹出<br>
    干饭人今天吃什么
  </p>

  <!-- 偏好弹窗 -->
  <div class="overlay" id="prefOverlay">
    <div class="panel">
      <div class="panel-head"><span>今天有偏好吗？</span><button class="x" data-act="closePrefs">X</button></div>
      <div class="panel-body">
        <div class="req-label"><span class="must">必选</span> 时段</div>
        <div class="pick-row" id="mealRow"></div>

        <div class="req-label"><span class="must">必选</span> 轻食健康</div>
        <div class="pick-row" id="lightRow"></div>

        <div class="divider"></div>
        <div class="legend">可选偏好：点一下 = <span class="sw" style="background:var(--green)"></span>想吃 ·
          再点 = <span class="sw" style="background:var(--red)"></span>不想吃 · 再点 = 取消</div>
        <div id="groups"></div>

        <div class="avoid-hint" id="avoidHint" data-act="openAvoid" data-from="prefs"></div>
        <div class="actions"><button class="btn primary" style="flex:1" data-act="openConfirm">开始抽选</button></div>
      </div>
    </div>
  </div>

  <!-- 二次确认弹窗 -->
  <div class="overlay" id="confirmOverlay">
    <div class="panel">
      <div class="panel-head"><span>确认你的选择</span><button class="x" data-act="closeConfirm">X</button></div>
      <div class="panel-body">
        <div id="confirmBody"></div>
        <div class="actions">
          <button class="btn ghost" data-act="backToEdit">返回修改</button>
          <button class="btn primary" data-act="confirmDraw">确认抽选</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 饭票弹窗 -->
  <div class="overlay" id="receiptOverlay">
    <div class="receipt-wrap">
      <div class="receipt" id="receipt">
        <div class="brand">干 饭 贩 卖 机</div>
        <div class="rule"></div>
        <div class="cap">今 日 出 餐</div>
        <div class="emoji" id="r-emoji">🍜</div>
        <div class="name" id="r-name">兰州拉面</div>
        <div class="rule"></div>
        <div class="meta">
          <div><span>时段</span> <b id="r-meal">正餐</b></div>
          <div><span>标签</span> <b id="r-tags">面 · 热食</b></div>
          <div><span>时间</span> <b id="r-time">2026-09-20 12:30</b></div>
          <div><span>编号</span> <b id="r-no">#0482</b></div>
        </div>
        <div class="barcode" id="r-barcode"></div>
        <div class="stamp">已 出 餐</div>
      </div>
      <div class="zigzag"></div>
      <div class="receipt-actions">
        <button class="btn ghost" data-act="excludeAndAgain">换一个（排除这个）</button>
        <div class="receipt-row">
          <button class="btn ghost" data-act="again">再抽一次</button>
          <button class="btn primary" data-act="closeReceipt">就吃这个</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 美食库弹窗 -->
  <div class="overlay" id="libOverlay">
    <div class="panel">
      <div class="panel-head"><span>我的美食库</span><button class="x" data-act="closeLib">X</button></div>
      <div class="panel-body">
        <div id="foodList"></div>
        <div class="sec-title">＋ 添加我的外卖 / 餐厅</div>
        <div class="add-form">
          <div class="row">
            <input class="emoji-in" id="f-emoji" maxlength="2" placeholder="🍱">
            <input id="f-name" placeholder="名称，如：楼下螺蛳粉">
          </div>
          <div class="sec-title" style="margin-top:0">可出现的时段</div>
          <div class="tags" id="f-meal"></div>
          <div class="sec-title">标签</div>
          <div class="tags" id="f-tags"></div>
          <button class="btn" style="width:100%" data-act="addFood">加入美食库</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 忌口设置弹窗 -->
  <div class="overlay" id="avoidOverlay">
    <div class="panel">
      <div class="panel-head"><span>忌口设置</span><button class="x" data-act="closeAvoid">X</button></div>
      <div class="panel-body">
        <div class="hint">开启后，每次抽选都会自动排除这些食物（长期生效，存本地）。</div>
        <div class="chips" id="avoidChips"></div>
        <div class="actions" style="margin-top:14px"><button class="btn primary" style="flex:1" data-act="closeAvoid">完成</button></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="./foods.js"></script>
<script src="./app.js"></script>
</body>
</html>
